# Pansari Wala — nginx site config
# Install: sudo cp scripts/nginx-pansariwala.conf /etc/nginx/conf.d/pansariwala.conf
# Replace DOMAIN and WEB_ROOT before use (bootstrap-ec2-web.sh does this).

upstream pansari_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP → HTTPS redirect (certbot adds ssl blocks below)
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN api.DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Marketing + web SPA (Compose JS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root WEB_ROOT;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm application/octet-stream;
    gzip_min_length 256;

    # webApp.js / composeResources are NOT content-hashed: a stale cached bundle after a
    # deploy mixes with new index.html and leaves the SPA half-loaded. Revalidate via ETag (304).
    location ~* \.(js|mjs|css|wasm|cvr|json|map)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), bluetooth=(self), usb=(self), serial=(self)" always;
        etag on;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), bluetooth=(self), usb=(self), serial=(self)" always;
        try_files $uri =404;
    }

    # nginx drops server-level add_header in any location that sets its own, so every
    # location repeats the security headers.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), bluetooth=(self), usb=(self), serial=(self)" always;
        try_files $uri $uri/ /index.html;
    }

    # Shop POS and master consoles: never indexed, never cached by shared proxies.
    location ~ ^/(pos|master)(/|$) {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), bluetooth=(self), usb=(self), serial=(self)" always;
        try_files /index.html =404;
    }
}

# Ktor API + WebSockets
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # Browser SPA (pansariwala.shop) → API: nginx owns CORS so preflight
    # never depends on Ktor / upstream being up-to-date.
    set $cors_origin "*";
    if ($http_origin ~* "^https://(www\.)?pansariwala\.shop$") {
        set $cors_origin $http_origin;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-App-Language" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://pansari_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Drop Ktor CORS headers to avoid duplicates; nginx is source of truth.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-App-Language" always;
    }

    location /ws/ {
        proxy_pass http://pansari_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
