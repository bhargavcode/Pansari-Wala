name: CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_server:
        description: "Upload server JAR to EC2 and restart"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS (placeholder — not implemented yet)"
        type: boolean
        default: false

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  flags:
    name: Read CICDflags
    runs-on: ubuntu-latest
    outputs:
      android_enabled: ${{ steps.read.outputs.android_enabled }}
      android_distribute: ${{ steps.read.outputs.android_distribute }}
      ios_enabled: ${{ steps.read.outputs.ios_enabled }}
      web_enabled: ${{ steps.read.outputs.web_enabled }}
      server_enabled: ${{ steps.read.outputs.server_enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Parse .github/cicd.flags
        run: |
          flag() {
            local key="$1"
            local val
            val="$(grep -E "^[[:space:]]*${key}[[:space:]]*=" .github/cicd.flags | tail -1 | cut -d= -f2- | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            case "$val" in
              true|1|yes) echo true ;;
              *) echo false ;;
            esac
          }
          {
            echo "android_enabled=$(flag android_enabled)"
            echo "android_distribute=$(flag android_distribute)"
            echo "ios_enabled=$(flag ios_enabled)"
            echo "web_enabled=$(flag web_enabled)"
            echo "server_enabled=$(flag server_enabled)"
          } | tee -a "$GITHUB_OUTPUT"
          echo "CI flags:"
          cat "$GITHUB_OUTPUT"

  android:
    name: Android ${{ matrix.flavor }} (debug + release)
    needs: flags
    if: needs.flags.outputs.android_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: pos
            task: Pos
            firebase_key: POS
          - flavor: user
            task: User
            firebase_key: USER
          - flavor: delivery
            task: Delivery
            firebase_key: DELIVERY
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for signed release builds"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble ${{ matrix.flavor }} APKs
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew \
            :androidApp:assemble${{ matrix.task }}Release \
            :androidApp:assemble${{ matrix.task }}Debug \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            --parallel --max-workers=4 \
            --no-daemon --stacktrace

      - name: Upload ${{ matrix.flavor }} APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ matrix.flavor }}-${{ github.run_id }}
          path: androidApp/build/outputs/apk/${{ matrix.flavor }}/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Distribute ${{ matrix.flavor }} → Firebase App Distribution
        if: |
          needs.flags.outputs.android_distribute == 'true' &&
          (
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ secrets[format('FIREBASE_APP_ID_{0}', matrix.firebase_key)] }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS || 'testers' }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual build' }}
          FLAVOR: ${{ matrix.flavor }}
          KEEP: "2"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "Firebase secrets missing for $FLAVOR — skipping distribution"
            exit 0
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

          apk="$(find androidApp/build/outputs/apk -path "*/${FLAVOR}/release/*.apk" | head -1)"
          if [ -z "$apk" ]; then
            echo "::error::Release APK for $FLAVOR not found"
            exit 1
          fi
          NOTES="Build #${{ github.run_number }} (${GITHUB_SHA::7})
          ${COMMIT_MSG}"
          echo "Distributing $apk → $FIREBASE_APP_ID (groups: $FIREBASE_TESTER_GROUPS)"
          npx --yes firebase-tools@latest appdistribution:distribute "$apk" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "$NOTES"

          # Keep only the latest $KEEP releases for this app.
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          TOKEN="$(gcloud auth print-access-token)"
          API="https://firebaseappdistribution.googleapis.com/v1"
          parent="projects/$(echo "$FIREBASE_APP_ID" | cut -d: -f2)/apps/${FIREBASE_APP_ID}"
          stale="$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "${API}/${parent}/releases?pageSize=100&orderBy=createTime%20desc" \
            | jq -c --argjson keep "$KEEP" '[.releases // [] | .[$keep:][] | .name]')"
          if [ "$stale" != "[]" ]; then
            echo "Deleting $(echo "$stale" | jq length) old release(s)"
            curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"names\": $stale}" "${API}/${parent}/releases:batchDelete" >/dev/null
          fi

  web:
    name: Web (JS distribution)
    needs: flags
    if: needs.flags.outputs.web_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JS browser distribution
        run: ./gradlew :webApp:jsBrowserDistribution --parallel --max-workers=4 --no-daemon --stacktrace

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-js-dist-${{ github.run_id }}
          path: webApp/build/dist/js/productionExecutable
          if-no-files-found: warn
          retention-days: 90

      - name: Check EC2 secrets
        id: ec2
        if: |
          needs.flags.outputs.web_enabled == 'true' &&
          (
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_WEB_ROOT: ${{ secrets.EC2_WEB_ROOT }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "EC2 secrets missing — skipping web deploy (see docs/AWS-HOSTING.md)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy web to EC2
        if: steps.ec2.outputs.skip == 'false'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_WEB_ROOT: ${{ secrets.EC2_WEB_ROOT || '/var/www/pansariwala' }}
        run: |
          # Trim accidental whitespace/newlines from secrets
          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r\n' | xargs)"
          EC2_USER="$(printf '%s' "$EC2_USER" | tr -d '\r\n' | xargs)"
          KEY_PATH="${RUNNER_TEMP}/ec2_key.pem"
          printf '%s\n' "$EC2_SSH_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export EC2_HOST EC2_USER
          export EC2_SSH_KEY_PATH="$KEY_PATH"
          export EC2_WEB_ROOT="${EC2_WEB_ROOT:-/var/www/pansariwala}"
          export DIST_DIR="webApp/build/dist/js/productionExecutable"
          echo "EC2_WEB_ROOT=$EC2_WEB_ROOT"
          chmod +x scripts/deploy-web.sh
          ./scripts/deploy-web.sh

  server:
    name: Server (fat JAR)
    needs: flags
    if: needs.flags.outputs.server_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build server shadow JAR
        run: ./gradlew :server:shadowJar --parallel --max-workers=4 --no-daemon --stacktrace

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: pansari-server-jar-${{ github.run_id }}
          path: server/build/libs/pansari-server-all.jar
          if-no-files-found: error
          retention-days: 90

      - name: Check EC2 secrets
        id: ec2
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_server)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_DEPLOY_PATH" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "EC2 secrets missing — skipping deploy (see docs/CICD.md)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy JAR to EC2
        if: steps.ec2.outputs.skip == 'false'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          EC2_SERVICE_NAME: ${{ secrets.EC2_SERVICE_NAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          CASHFREE_ENV: ${{ secrets.CASHFREE_ENV }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
        run: |
          EC2_HOST="$(printf '%s' "$EC2_HOST" | tr -d '\r\n' | xargs)"
          EC2_USER="$(printf '%s' "$EC2_USER" | tr -d '\r\n' | xargs)"
          KEY_PATH="${RUNNER_TEMP}/ec2_key.pem"
          printf '%s\n' "$EC2_SSH_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export EC2_HOST EC2_USER
          export EC2_SSH_KEY_PATH="$KEY_PATH"
          export EC2_SERVICE_NAME="${EC2_SERVICE_NAME:-pansari-server}"
          chmod +x scripts/deploy-server.sh
          ./scripts/deploy-server.sh

  prune-artifacts:
    name: Prune artifacts (keep latest 5 per type)
    needs: [flags, android, web, server]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than the latest 5 builds
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 5;
            // Android uploads one artifact per flavor (3 per run).
            const keepFor = (prefix) => (prefix === 'android-apks-' ? keep * 3 : keep);
            const prefixes = ['android-apks-', 'web-js-dist-', 'pansari-server-jar-'];
            const legacyNames = ['android-apks', 'web-js-dist', 'pansari-server-jar'];
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const pruneGroup = (matches, limit = keep) => {
              const sorted = matches.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              return sorted.slice(limit);
            };
            for (const prefix of prefixes) {
              const stale = pruneGroup(all.filter((a) => a.name.startsWith(prefix)), keepFor(prefix));
              for (const artifact of stale) {
                core.info(`Deleting ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
            for (const legacyName of legacyNames) {
              const stale = pruneGroup(all.filter((a) => a.name === legacyName));
              for (const artifact of stale) {
                core.info(`Deleting legacy ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

  ios:
    name: iOS (placeholder — manual only)
    needs: flags
    runs-on: macos-latest
    if: |
      needs.flags.outputs.ios_enabled == 'true' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_ios)
      )
    steps:
      - uses: actions/checkout@v4
      - name: iOS builds not enabled yet
        run: |
          echo "iOS CI is scaffolded but not implemented."
          echo "Enable later: Xcode schemes (POS/USER/DELIVERY) + signing secrets."
          echo "See docs/CICD.md § iOS"
          exit 1
